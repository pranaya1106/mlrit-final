version: '3.8'

services:
  chatbot:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - ./pdfs:/app/pdfs
      - ./chroma_db:/app/chroma_db
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
