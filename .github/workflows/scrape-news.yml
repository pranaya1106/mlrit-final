name: Scrape news

on:
  schedule:
    # 00:30 and 12:30 UTC = ~06:00 and ~18:00 IST — twice a day.
    - cron: '30 0,12 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper deps
        working-directory: backend
        run: pip install httpx feedparser

      - name: Scrape + build snapshot
        working-directory: backend
        env:
          NEWS_API_URL: ${{ secrets.NEWS_API_URL }}
          EXPORT_DIR: ${{ github.workspace }}/backend/export
        run: python scripts/export_snapshot.py

      # NB: wrangler's kv key put flags have moved around across major versions
      # (--binding vs --namespace-id, --remote becoming required). Verify against
      # `npx wrangler kv key put --help` in worker/ if this step starts failing.
      - name: Push snapshot to Cloudflare KV
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler kv key put news_items --remote \
            --namespace-id "${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}" \
            --path "${{ github.workspace }}/backend/export/news_items.json"
          npx wrangler kv key put achievements --remote \
            --namespace-id "${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}" \
            --path "${{ github.workspace }}/backend/export/achievements.json"
